*{
  box-sizing:border-box
}

html{
  margin:0;
  padding:0;
  background-color:#ffffff;
  color:#111111
}

body{
  margin:0;
  padding:0;
  background-color:#ffffff;
  color:#111111;
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif
}

@media (prefers-color-scheme: dark){
  html,body{
    background-color:#121212;
    color:#ffffff
  }
}

#root,#app-root{
  background-color:#ffffff;
  color:#111111
}

@media (prefers-color-scheme: dark){
  #root,#app-root{
    background-color:#121212;
    color:#ffffff
  }
}

#pin-screen{
  background-color:#ffffff;
  color:#111111;
  min-height:100vh
}

#app{
  background-color:#ffffff;
  color:#111111;
  min-height:100vh
}

@media (prefers-color-scheme: dark){
  #pin-screen,#app{
    background-color:#121212;
    color:#ffffff
  }
}

button,input,select,textarea{
  font:inherit;
  color:inherit;
  min-height:46px
}

button{
  cursor:pointer
}

input,select,textarea{
  background-color:#ffffff;
  color:#111111;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  width:100%
}

@media (prefers-color-scheme: dark){
  input,select,textarea{
    background-color:#1e1e1e;
    color:#ffffff
  }
}

input::-moz-placeholder, textarea::-moz-placeholder{
  color:var(--muted);
  opacity:1
}

input::placeholder,textarea::placeholder{
  color:var(--muted);
  opacity:1
}

select option{
  background-color:var(--surface);
  color:var(--ink)
}

textarea{
  min-height:84px;
  resize:vertical
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-weight:800
}

:focus-visible{
  outline:3px solid var(--accent2);
  outline-offset:2px
}

.small{
  font-size:13px;
  color:var(--muted)
}

.muted{
  color:var(--muted)
}

.card{
  background-color:#ffffff;
  color:#111111;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:16px
}

@media (prefers-color-scheme: dark){
  .card{
    background-color:#1e1e1e;
    color:#ffffff
  }
}

.card h2,.card h3{
  color:inherit
}

.pin-screen{
  background-color:#ffffff;
  color:#111111
}

@media (prefers-color-scheme: dark){
  .pin-screen{
    background-color:#121212;
    color:#ffffff
  }
}

.pin-screen .pin-muted{
  color:var(--muted)
}

.pin-input{
  background-color:#ffffff !important;
  color:#111111 !important;
  border:2px solid var(--line) !important
}

@media (prefers-color-scheme: dark){
  .pin-input{
    background-color:#1e1e1e !important;
    color:#ffffff !important
  }
}

.pin-key{
  background-color:#ffffff !important;
  color:#111111 !important;
  border:1.5px solid var(--pin-key-line) !important
}

@media (prefers-color-scheme: dark){
  .pin-key{
    background-color:#1e1e1e !important;
    color:#ffffff !important
  }
}

.pin-error{
  color:var(--red)
}

.pin-enter{
  background-color:var(--accent2);
  color:#111
}

.pin-enter:disabled{
  background-color:var(--surface2);
  color:var(--muted);
  opacity:1
}

.btn-primary{
  background:var(--accent);
  color:#fff
}

.btn-dark{
  background:#17201e;
  color:#fff
}

.btn-ghost{
  background:var(--surface2);
  color:var(--ink);
  border:1px solid var(--line)
}

.btn-yellow{
  background:var(--accent2);
  color:#171717
}

.btn-red{
  background:var(--red);
  color:#fff
}

.btn-danger{
  background:transparent;
  color:var(--red);
  border:1px solid var(--red)
}

.chip{
  border:1.5px solid var(--line);
  background:var(--surface2);
  border-radius:999px;
  padding:8px 12px;
  min-height:46px;
  font-weight:800
}

.chip.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent)
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:6px;
  letter-spacing:.02em;
  color:var(--ink)
}

.measure-card .field label{
  color:var(--measure-label)
}

.check{
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  min-height:46px
}

.check input{
  width:24px;
  height:24px;
  min-height:24px;
  accent-color:var(--accent)
}

.measure-form{
  display:grid;
  gap:16px
}

.measure-card{
  background:#ffffff;
  border:1px solid var(--measure-card-line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:18px;
  color:#111111
}

@media (prefers-color-scheme: dark){
  .measure-card{
    background:#1e1e1e;
    color:#ffffff
  }
}

.measure-card input,.measure-card select,.measure-card textarea{
  background:#fbfaf6;
  border:1.5px solid var(--measure-field-line);
  color:#111111;
  border-radius:10px;
  min-height:46px
}

@media (prefers-color-scheme: dark){
  .measure-card input,.measure-card select,.measure-card textarea{
    background:#262626;
    color:#ffffff
  }
}

.measure-card input::-moz-placeholder, .measure-card textarea::-moz-placeholder{
  color:var(--measure-label);
  opacity:.85
}

.measure-card input::placeholder,.measure-card textarea::placeholder{
  color:var(--measure-label);
  opacity:.85
}

.measure-card .field label{
  color:var(--measure-label);
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em
}

.measure-card .small{
  color:var(--measure-label)
}

.measure-grid5{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px
}

.measure-pedido-row{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:12px;
  margin-top:12px
}

.measure-add-btn{
  background:var(--measure-field);
  border:1.5px solid var(--measure-field-line);
  color:var(--measure-ink);
  border-radius:10px;
  min-height:46px;
  padding:10px 16px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.02em
}

.measure-card .chip{
  background:var(--measure-chip);
  border:1.5px solid var(--measure-field-line);
  color:var(--measure-ink)
}

.measure-card .chip.active{
  background:var(--tab-active);
  color:#fff;
  border-color:var(--tab-active)
}

.measure-garment{color:#3A2E3A}
.measure-garment .field label{color:#8A5A6E!important}
.measure-garment p,.measure-garment span{color:#3A2E3A}
.measure-garment input,.measure-garment select,.measure-garment textarea{background:#ffffff!important;border-color:#EAC4D5!important;color:#3A2E3A!important}
.measure-garment{
  background:var(--measure-field);
  border:1px solid var(--measure-field-line);
  border-radius:14px;
  padding:14px
}

.measure-conform{
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer
}

.measure-conform input{
  width:30px;
  height:30px;
  min-height:30px;
  accent-color:var(--tab-active);
  flex:0 0 auto
}

.measure-save{
  background:var(--tab-active);
  color:#fff;
  min-height:46px;
  display:inline-flex;
  align-items:center;
  gap:8px
}

.measure-new{
  background:var(--measure-field);
  color:var(--measure-ink);
  border:1.5px solid var(--measure-field-line);
  min-height:46px;
  display:inline-flex;
  align-items:center;
  gap:8px
}

.measure-remove{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:transparent;
  color:var(--red);
  border:1.5px solid var(--red);
  min-height:46px
}

.table{
  width:100%;
  border-collapse:collapse
}

.table th,.table td{
  border:1px solid #999;
  padding:6px;
  text-align:center;
  font-size:13px
}

.table th{
  background:#eee
}

.label-filter-label{
  font-size:17px !important
}

@media (max-width:900px){
  .measure-grid5,.measure-pedido-row{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
}

@media (max-width:760px){
  .grid2,.grid3,.grid4{
    grid-template-columns:1fr 1fr
  }

  .tabs{
    overflow-x:auto;
    white-space:nowrap
  }

  .tabs button{
    flex:0 0 auto
  }
}

@media (max-width:520px){
  .grid2,.grid3,.grid4{
    grid-template-columns:1fr
  }

  .measure-grid5,.measure-pedido-row{
    grid-template-columns:1fr
  }

  .measure-card{
    padding:14px
  }
}

  <script>
window.__printSasteria=function(sel,title){
  var isEti = (title && title.indexOf("Etiqueta")!==-1) || (sel && sel.indexOf("etiquetas")!==-1);
  var content="";
  if(isEti){
    var sheets=document.querySelectorAll('section[aria-label^="Hoja carta"]');
    if(sheets.length){
      var altos=[54,51.5,53.5,52,53];
      var altosStr=["54mm","51.5mm","53.5mm","52mm","53mm"];
      sheets.forEach(function(sec){
        var tmp=document.createElement("div");
        tmp.innerHTML=sec.outerHTML;
        var clone=tmp.firstChild;
        if(clone.children.length>1){ clone.removeChild(clone.children[0]); }
        var grid=clone.children[0];
        if(grid){
          grid.style.padding="0";
          grid.style.paddingTop="6mm";
          grid.style.paddingBottom="9.4mm";
          grid.style.gap="0";
          grid.style.margin="0 auto";
          grid.style.width="208mm";
          grid.style.height="279.4mm";
          grid.style.boxSizing="border-box";
          grid.style.boxShadow="none";
          grid.style.borderRadius="0";
          grid.style.overflow="hidden";
          grid.style.gridTemplateColumns="104mm 104mm";
          grid.style.gridTemplateRows="54mm 51.5mm 53.5mm 52mm 53mm";
          grid.style.background="#fff";
          Array.from(grid.children).forEach(function(cell, idx){
            var fila=Math.floor(idx/2);
            var hNum=altos[fila]||53;
            var hStr=altosStr[fila]||"53mm";
            var innerH=(hNum-4)+"mm";
            cell.style.border="0";
            cell.style.padding="2mm";
            cell.style.margin="0";
            cell.style.boxSizing="border-box";
            cell.style.height=hStr;
            cell.style.overflow="hidden";
            cell.style.display="flex";
            cell.style.justifyContent="center";
            cell.style.alignItems="center";
            cell.style.background="#fff";
            var inner=cell.firstChild;
            if(inner){
              inner.style.width="100mm";
              inner.style.height=innerH;
              inner.style.maxWidth="none";
              inner.style.minWidth="0";
              inner.style.boxSizing="border-box";
              inner.style.overflow="hidden";
              inner.style.flexShrink="0";
            }
          });
        }
        clone.style.margin="0";
        clone.style.padding="0";
        clone.style.maxWidth="215.9mm";
        clone.style.width="215.9mm";
        clone.style.height="279.4mm";
        clone.style.boxSizing="border-box";
        content+=clone.outerHTML;
      });
    } else {
      var el2=document.querySelector(sel);
      if(!el2){alert("Primero toca Ver para mostrar la vista previa y luego Imprimir.");return;}
      content=el2.outerHTML;
    }
  } else {
    var ord=document.querySelector('.print-page') || document.querySelector(sel);
    if(!ord){alert("Primero toca Ver para mostrar la vista previa y luego Imprimir.");return;}
    content=ord.outerHTML;
  }
  var w=window.open("","_blank");
  if(!w){alert("Permite las ventanas emergentes para imprimir.");return;}
  var styles="";
  try{document.querySelectorAll("style").forEach(function(s){styles+=s.outerHTML;});}catch(e){}
  var extra = isEti ? "<style>html,body{margin:0!important;padding:0!important;background:#fff!important;color:#000!important} body{font-family:Arial,sans-serif} @page{size:letter;margin:0} .print-page{width:215.9mm!important;max-width:215.9mm!important;margin:0 auto!important;padding:12mm 10mm!important;box-sizing:border-box!important} section{page-break-after:always!important;margin:0!important;padding:0!important;max-width:215.9mm!important;width:215.9mm!important;height:279.4mm!important;box-sizing:border-box!important;overflow:hidden!important} section:last-child{page-break-after:auto!important} button{display:none!important} @media print{html,body{background:#fff!important} *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}</style>" : "<style>html,body{margin:0!important;padding:0!important;background:#fff!important;color:#000!important} body{font-family:Arial,sans-serif} @page{size:letter;margin:0} .print-page{width:215.9mm!important;max-width:215.9mm!important;height:279.4mm!important;margin:0 auto!important;padding:5mm 6mm 4mm!important;box-sizing:border-box!important;overflow:hidden!important} .print-page table{width:100%!important;border-collapse:collapse!important;font-size:8.5pt!important;line-height:1.1!important} .print-page table th,.print-page table td{padding:1.8px 3px!important;font-size:8.5pt!important;line-height:1.1!important} .print-page h2{margin:0 0 4px!important;font-size:14pt!important;letter-spacing:2px} .print-page p{margin:2px 0!important} .print-page div{line-height:1.15!important} section{page-break-after:auto!important;margin:0!important;padding:0!important;max-width:215.9mm!important;width:auto!important;height:auto!important;box-sizing:border-box!important;overflow:visible!important} button{display:none!important} @media print{html,body{background:#fff!important} *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}</style>";
  var autoFit = isEti ? "" : "<script>window.addEventListener('load',function(){try{var p=document.querySelector('.print-page');if(!p)return;var maxH=1058;var h=p.offsetHeight;if(h>maxH){var s=maxH/h; p.style.transform='scale('+s+')'; p.style.transformOrigin='top left'; p.style.width=(215.9/s)+'mm'; p.style.height=(279.4/s)+'mm';}}catch(e){}});<\/script>";
  var docHtml="<html><head><meta charset='utf-8'><title>"+title+"</title>"+styles+extra+"</head><body>"+content+autoFit+"
<style>
#app header{transition:transform .22s ease, opacity .18s ease; will-change:transform;}
#app header.sasteria-header-hidden{transform:translateY(-110%); opacity:.98; pointer-events:none;}
</style>
<script>
(function(){
  var lastY = window.scrollY || 0;
  var ticking = false;
  function update(){
    ticking = false;
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if (y < 0) y = 0;
    var header = document.querySelector('#app header');
    if(!header){ lastY = y; return; }
    if (y <= 0){
      header.classList.remove('sasteria-header-hidden');
    } else if (y > lastY){
      if (y - lastY >= 1) header.classList.add('sasteria-header-hidden');
    } else if (y < lastY){
      if (lastY - y >= 1) header.classList.remove('sasteria-header-hidden');
    }
    lastY = y;
  }
  window.addEventListener('scroll', function(){ if(!ticking){ ticking = true; requestAnimationFrame(update); } }, {passive:true});
})();
</script>
</body>
</html>";
  w.document.write(docHtml);
  w.document.close();
  w.focus();
  setTimeout(function(){try{w.print()}catch(e){}},500);
};

<script>

(function(){
  var KEY = "sasteria_conjuntos_por_empresa_v1";
   function getVendedora(){ try{ var h=document.body.innerText.match(/Hola,\s*([^\n]+)/); if(h) return h[1].trim(); var sel=document.querySelector('select'); if(sel && sel.value) return sel.value.trim(); }catch(e){} return "Administrador"; }
   function getConjuntosKey(empresa){ var v=getVendedora(); if(v==="Administrador") return empresa; return v+"|"+empresa; }
   function getListForEmpresa(all, empresa){ var v=getVendedora(); if(v==="Administrador"){ var out=[]; Object.keys(all).forEach(function(k){ if(k===empresa || k.endsWith("|"+empresa)) out=out.concat(all[k]||[]); }); return out; } return all[getConjuntosKey(empresa)]||[]; }
   function setListForEmpresa(all, empresa, list){ var v=getVendedora(); if(v==="Administrador"){ all=setListForEmpresa(all, empresa, list); } else { all[getConjuntosKey(empresa)]=list; } return all; }
  function loadAll(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
  function saveAll(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  function getEmpresaInput(){ return document.querySelector('input[data-empresa-input="1"]') || document.querySelector('input[list="empresas"]'); }
  function isPinScreen(){ try{ var t=document.body.innerText||""; return t.indexOf("Escribe tu PIN")!==-1 || t.indexOf("Sesión local en esta vista")!==-1; }catch(e){ return false; } }
  function isLoggedIn(){ try{ var t=document.body.innerText||""; return t.indexOf("Hola,")!==-1; }catch(e){ return false; } }
  function isFormVisible(form){ try{ if(!form) return false; var s=window.getComputedStyle(form); if(s.display==="none"||s.visibility==="hidden") return false; if(form.offsetParent===null && s.position!=="fixed") return false; return true; }catch(e){ return !!form; } }
  function hideConjuntosPanel(){ var p=document.getElementById("conjuntos-floating-panel"); if(p){ p.style.display="none"; if(p._toggle) p._toggle.style.display="none"; p.dataset.rendered=""; } var tog=document.getElementById("conjuntos-toggle"); if(tog) tog.style.display="none"; }
  function getEmpresa(){ var el=getEmpresaInput(); return el ? el.value.trim() : ""; }
  function getGender(){
    var btns = Array.from(document.querySelectorAll(".measure-add-btn"));
    for(var i=0;i<btns.length;i++){ if(btns[i].textContent.indexOf("CAMISA")!==-1) return "CAB"; }
    return "DAMA";
  }
  function garmentTypesFor(gender){ return gender==="CAB" ? ["Saco","Pantalón","Camisa","Chaleco"] : ["Saco","Pantalón","Blusa","Falda","Chaleco","Vestido"]; }
  function setInputValue(input, val){
    var proto = window.HTMLInputElement.prototype;
    var desc = Object.getOwnPropertyDescriptor(proto, "value");
    if(desc && desc.set){ desc.set.call(input, val); } else { input.value = val; }
    input.dispatchEvent(new Event("input", {bubbles:true}));
    input.dispatchEvent(new Event("change", {bubbles:true}));
  }
  function findAddBtn(tipo){
    var btns = Array.from(document.querySelectorAll(".measure-add-btn"));
    for(var i=0;i<btns.length;i++){
      var t = btns[i].textContent.replace("+","").trim().toLowerCase();
      if(t===tipo.toLowerCase()) return btns[i];
    }
    return null;
  }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  async function addConjuntoToPerson(conjunto){
    if(!conjunto) return;
    var btnAdd = document.querySelector('[data-conjuntos-add="'+conjunto.id+'"]');
    if(btnAdd){ btnAdd.textContent="Agregando..."; btnAdd.disabled=true; }
    try{
      for(var gi=0; gi<conjunto.prendas.length; gi++){
        var pr = conjunto.prendas[gi];
        var cant = Math.max(1, Math.min(5, parseInt(pr.cantidad||1,10)||1));
        for(var k=0;k<cant;k++){
          var btn = findAddBtn(pr.tipo);
          if(!btn) continue;
          var before = document.querySelectorAll(".measure-garment").length;
          btn.click();
          var tries=0; var cards=null;
          while(tries<20){
            await sleep(120);
            cards = document.querySelectorAll(".measure-garment");
            if(cards.length>before) break;
            tries++;
          }
          if(!cards || cards.length===0) continue;
          var last = cards[cards.length-1];
          var fields = last.querySelectorAll(".field");
          var inputs = {};
          fields.forEach(function(f){
            var lab = f.querySelector("label");
            var inp = f.querySelector("input");
            if(lab && inp){ var txt = lab.textContent.trim().toLowerCase(); if(txt==="estilo") inputs.estilo=inp; if(txt==="tela") inputs.tela=inp; if(txt==="color") inputs.color=inp; if(txt.indexOf("conjunto")!==-1) inputs.conjunto=inp; }
          });
          if(inputs.estilo) setInputValue(inputs.estilo, pr.estilo||"");
          await sleep(60);
          if(inputs.tela) setInputValue(inputs.tela, pr.tela||"");
          await sleep(60);
          if(inputs.color) setInputValue(inputs.color, pr.color||"");
          await sleep(60);
          if(inputs.conjunto && conjunto._order) setInputValue(inputs.conjunto, conjunto._order + " - " + conjunto.nombre);
          await sleep(120);
        }
      }
    } finally {
      if(btnAdd){ btnAdd.textContent="Agregar a esta persona"; btnAdd.disabled=false; }
    }
  }
  function openForm(empresa, conjunto){
    var existing = document.getElementById("conjuntos-form-overlay");
    if(existing) existing.remove();
    var gender = getGender();
    var types = garmentTypesFor(gender);
    var isEdit = !!conjunto;
    var overlay = document.createElement("div");
    overlay.id="conjuntos-form-overlay";
    overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:10001;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;";
    var box = document.createElement("div");
    box.style.cssText="background:#1c2320;color:#fff;border:1.5px solid #3d4742;border-radius:16px;padding:20px;max-width:680px;width:100%;";
    var title = document.createElement("h3");
    title.style.cssText="margin:0 0 6px;font-size:19px;";
    title.textContent = isEdit ? "Editar conjunto" : "Nuevo conjunto para "+empresa;
    box.appendChild(title);
    var sub = document.createElement("p");
    sub.style.cssText="margin:0 0 14px;color:#d7ddd9;font-size:13px;";
    sub.textContent = "Define una sola vez lo que lleva este conjunto. Después, para cada persona solo le das a Agregar y ya sale todo lleno. Si una persona lleva menos prendas, borras las que sobren.";
    box.appendChild(sub);
    var nameLabel = document.createElement("label");
    nameLabel.style.cssText="display:block;font-weight:800;font-size:14px;margin-bottom:6px;";
    nameLabel.textContent="Nombre del conjunto (ej. Recepción, Ventas, Gerencia)";
    box.appendChild(nameLabel);
    var nameInput = document.createElement("input");
    nameInput.value = conjunto ? conjunto.nombre : "";
    nameInput.placeholder="Ej. Recepción";
    nameInput.style.cssText="width:100%;padding:12px;border-radius:10px;border:1.5px solid #3d4742;background:#fff;color:#111;font-size:16px;font-weight:700;margin-bottom:6px;";
    box.appendChild(nameInput);
    var areaLabel = document.createElement("label");
    areaLabel.style.cssText="display:block;font-weight:800;font-size:14px;margin:10px 0 6px;";
    areaLabel.textContent="Área (opcional, ej. RECEPCIÓN)";
    box.appendChild(areaLabel);
    var areaInput = document.createElement("input");
    areaInput.value = conjunto ? (conjunto.area||"") : "";
    areaInput.placeholder="Ej. RECEPCIÓN";
    areaInput.style.cssText="width:100%;padding:12px;border-radius:10px;border:1.5px solid #3d4742;background:#fff;color:#111;font-size:16px;margin-bottom:14px;";
    box.appendChild(areaInput);
    var rows = {};
    types.forEach(function(tipo){
      var found = conjunto ? conjunto.prendas.find(function(p){return p.tipo===tipo;}) : null;
      var row = document.createElement("div");
      row.style.cssText="border:1px solid #3d4742;border-radius:12px;padding:12px;margin-bottom:10px;";
      var head = document.createElement("div");
      head.style.cssText="display:flex;align-items:center;gap:10px;flex-wrap:wrap;";
      var chk = document.createElement("input");
      chk.type="checkbox"; chk.checked = !!found;
      chk.style.cssText="width:22px;height:22px;";
      var b = document.createElement("b");
      b.textContent = tipo.toUpperCase();
      b.style.cssText="font-size:16px;";
      var cantLabel = document.createElement("span");
      cantLabel.textContent="Cantidad:";
      cantLabel.style.cssText="font-size:13px;color:#d7ddd9;";
      var cant = document.createElement("input");
      cant.type="number"; cant.min="1"; cant.max="5"; cant.value = found ? (found.cantidad||1) : 1;
      cant.style.cssText="width:60px;padding:8px;border-radius:8px;border:1.5px solid #3d4742;background:#fff;color:#111;font-size:15px;font-weight:700;";
      head.appendChild(chk); head.appendChild(b); head.appendChild(cantLabel); head.appendChild(cant);
      row.appendChild(head);
      var grid = document.createElement("div");
      grid.style.cssText="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;";
      function mkField(label, val){
        var d=document.createElement("div");
        var l=document.createElement("label"); l.textContent=label; l.style.cssText="display:block;font-size:12px;font-weight:700;color:#d7ddd9;margin-bottom:4px;";
        var inp=document.createElement("input"); inp.value=val||""; inp.placeholder=label;
        inp.style.cssText="width:100%;padding:10px;border-radius:8px;border:1.5px solid #3d4742;background:#fff;color:#111;font-size:15px;";
        d.appendChild(l); d.appendChild(inp); return {wrap:d, input:inp};
      }
      var f1=mkField("Estilo", found?found.estilo:"");
      var f2=mkField("Tela", found?found.tela:"");
      var f3=mkField("Color", found?found.color:"");
      grid.appendChild(f1.wrap); grid.appendChild(f2.wrap); grid.appendChild(f3.wrap);
      row.appendChild(grid);
      box.appendChild(row);
      rows[tipo]={chk:chk, cant:cant, estilo:f1.input, tela:f2.input, color:f3.input};
    });
    var btnRow = document.createElement("div");
    btnRow.style.cssText="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;";
    var saveBtn = document.createElement("button");
    saveBtn.textContent = isEdit ? "Guardar cambios" : "Guardar conjunto";
    saveBtn.style.cssText="background:#2ec4a6;color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;";
    var cancelBtn = document.createElement("button");
    cancelBtn.textContent="Cancelar";
    cancelBtn.style.cssText="background:#333;color:#fff;border:1.5px solid #555;padding:12px 18px;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;";
    btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    cancelBtn.onclick=function(){ overlay.remove(); };
    overlay.addEventListener("click", function(e){ if(e.target===overlay) overlay.remove(); });
    saveBtn.onclick=function(){
      var nombre = nameInput.value.trim();
      if(!nombre){ alert("Ponle un nombre al conjunto, ej. Recepción"); nameInput.focus(); return; }
      var prendas=[];
      types.forEach(function(tipo){
        var r=rows[tipo];
        if(r.chk.checked){
          prendas.push({tipo:tipo, cantidad: Math.max(1, Math.min(5, parseInt(r.cant.value||1,10)||1)), estilo:r.estilo.value.trim(), tela:r.tela.value.trim(), color:r.color.value.trim()});
        }
      });
      if(prendas.length===0){ alert("Marca al menos una prenda que lleve este conjunto"); return; }
      var all = loadAll();
      var list = getListForEmpresa(all, empresa);
      if(isEdit){
        var idx = list.findIndex(function(c){return c.id===conjunto.id;});
        if(idx>=0) list[idx]={id:conjunto.id, nombre:nombre, area:areaInput.value.trim(), prendas:prendas};
      } else {
        if(list.length>=5){ alert("Esta empresa ya tiene 5 conjuntos. Borra uno para crear otro."); return; }
        list.push({id:"cj-"+Date.now()+"-"+Math.floor(Math.random()*1000), nombre:nombre, area:areaInput.value.trim(), prendas:prendas});
      }
      all=setListForEmpresa(all, empresa, list);
      saveAll(all);
      overlay.remove();
      renderPanel(true);
    };
  }
  function renderPanel(force){
    // NUNCA mostrar en pantalla de PIN / login - solo después de que entre vendedora o admin
    if(isPinScreen() || !isLoggedIn()){
      hideConjuntosPanel();
      return;
    }
    var form = document.querySelector(".measure-form");
    var panel = document.getElementById("conjuntos-floating-panel");
    // Si no hay formulario de medidas VISIBLE, ocultar panel y botón
    if(!form || !isFormVisible(form)){
      hideConjuntosPanel();
      return;
    }
    if(!panel){
      panel = document.createElement("div");
      panel.id="conjuntos-floating-panel";
      // OUTSIDE React root, fixed so React never deletes it
      panel.style.cssText="position:fixed;top:78px;right:12px;width:360px;max-width:calc(100vw - 24px);max-height:calc(100vh - 100px);overflow:auto;background:#1c2320;color:#fff;border:2px solid #f5d76e;border-radius:16px;padding:14px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.5);";
      document.body.appendChild(panel);
      // Toggle button to collapse
      var toggle = document.createElement("button");
      toggle.id="conjuntos-toggle";
      toggle.textContent="Conjuntos ▲";
      toggle.style.cssText="position:fixed;top:78px;right:12px;z-index:10000;background:#f5d76e;color:#111;border:none;padding:8px 12px;border-radius:20px;font-weight:800;font-size:13px;cursor:pointer;display:none;";
      document.body.appendChild(toggle);
      toggle.onclick=function(){
        var p=document.getElementById("conjuntos-floating-panel");
        if(p.style.display==="none"){ p.style.display="block"; toggle.textContent="Conjuntos ▲"; }
        else { p.style.display="none"; toggle.textContent="Conjuntos ▼"; }
      };
      panel._toggle = toggle;
    }
    var empresa = getEmpresa();
    if(panel.dataset.empresa===empresa && !force && panel.dataset.rendered==="1"){
      panel.style.display="block";
      if(panel._toggle) panel._toggle.style.display="block";
      return;
    }
    panel.dataset.empresa = empresa;
    panel.dataset.rendered="1";
    panel.style.display="block";
    if(panel._toggle) panel._toggle.style.display="block";
    panel.innerHTML="";
    var close = document.createElement("button");
    close.textContent="— Minimizar";
    close.style.cssText="float:right;background:transparent;color:#d7ddd9;border:none;font-size:12px;cursor:pointer;";
    close.onclick=function(){ panel.style.display="none"; if(panel._toggle){ panel._toggle.style.display="block"; panel._toggle.textContent="Conjuntos ▼"; } };
    panel.appendChild(close);
    var h = document.createElement("h3");
    h.style.cssText="margin:0;font-size:16px;clear:both;";
    h.textContent = empresa ? "Conjuntos de "+empresa : "Conjuntos de la empresa";
    panel.appendChild(h);
    var p = document.createElement("p");
    p.style.cssText="margin:6px 0 0;color:#d7ddd9;font-size:12px;line-height:1.4;";
    p.textContent = empresa ? "Crea los conjuntos 1 sola vez. Para cada persona, dale a Agregar y ya salen sus prendas llenas. Si lleva solo 3 sacos, borra los que sobren." : "Escribe la Empresa arriba para ver sus conjuntos.";
    panel.appendChild(p);
    if(!empresa) return;
    var all = loadAll();
    var list = getListForEmpresa(all, empresa);
    var listDiv = document.createElement("div");
    listDiv.style.cssText="display:grid;gap:10px;margin-top:12px;";
    if(list.length===0){
      var empty = document.createElement("p");
      empty.style.cssText="margin:0;color:#fff;font-weight:700;font-size:13px;";
      empty.textContent="Esta empresa aún no tiene conjuntos. Crea el primero.";
      listDiv.appendChild(empty);
    } else {
      list.forEach(function(cj){
        var card = document.createElement("div");
        card.style.cssText="border:1.5px solid #3d4742;border-radius:12px;padding:10px;background:#222a27;";
        var title = document.createElement("b");
        title.style.cssText="font-size:15px;";
        title.textContent = cj.nombre + (cj.area ? "  ·  "+cj.area : "");
        card.appendChild(title);
        var detail = document.createElement("p");
        detail.style.cssText="margin:6px 0 0;font-size:12px;line-height:1.5;color:#e8ecea;";
        var total=0; cj.prendas.forEach(function(pr){ total += (pr.cantidad||1); });
        detail.textContent = total + " prenda(s): " + cj.prendas.map(function(pr){ return (pr.cantidad>1? pr.cantidad+"x ":"") + pr.tipo + " " + (pr.estilo||"") + " " + (pr.tela||"") + " " + (pr.color||""); }).join("  •  ");
        card.appendChild(detail);
        var btns = document.createElement("div");
        btns.style.cssText="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;";
        var addBtn = document.createElement("button");
        addBtn.type="button";
        addBtn.setAttribute("data-conjuntos-add", cj.id);
        addBtn.textContent="Agregar a esta persona";
        addBtn.style.cssText="background:#2ec4a6;color:#fff;border:none;padding:9px 12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;flex:1;";
        addBtn.onclick=function(){ var all2=loadAll(); var list2=getListForEmpresa(all2, empresa); var idx2=list2.findIndex(function(x){return x.id===cj.id;}); cj._order = (idx2>=0? idx2+1 : 1); addConjuntoToPerson(cj); };
        var editBtn = document.createElement("button");
        editBtn.type="button"; editBtn.textContent="Editar";
        editBtn.style.cssText="background:#333;color:#fff;border:1.5px solid #555;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;";
        editBtn.onclick=function(){ openForm(empresa, cj); };
        var delBtn = document.createElement("button");
        delBtn.type="button"; delBtn.textContent="Borrar";
        delBtn.style.cssText="background:transparent;color:#ff8a8a;border:1.5px solid #7a1f1f;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;";
        delBtn.onclick=function(){ if(!confirm("¿Borrar el conjunto "+cj.nombre+" de "+empresa+"?")) return; var a2=loadAll(); var l2=getListForEmpresa(a2, empresa); var filtered=l2.filter(function(x){return x.id!==cj.id;}); a2=setListForEmpresa(a2, empresa, filtered); saveAll(a2); renderPanel(true); };
        btns.appendChild(addBtn); btns.appendChild(editBtn); btns.appendChild(delBtn);
        card.appendChild(btns);
        listDiv.appendChild(card);
      });
    }
    panel.appendChild(listDiv);
    var newBtn = document.createElement("button");
    newBtn.type="button";
    newBtn.textContent = list.length>=5 ? "Ya tienes 5 conjuntos (máximo)" : "+ Nuevo conjunto para "+empresa;
    newBtn.disabled = list.length>=5;
    newBtn.style.cssText="margin-top:12px;width:100%;background:#f5d76e;color:#111;border:none;padding:11px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;opacity:"+(list.length>=5?"0.5":"1")+";";
    newBtn.onclick=function(){ openForm(empresa, null); };
    panel.appendChild(newBtn);
  }
  setInterval(function(){ try{ renderPanel(false); }catch(e){} }, 700);
  document.addEventListener("input", function(e){ if(e.target && e.target.getAttribute && (e.target.getAttribute("data-empresa-input")==="1" || e.target.getAttribute("list")==="empresas")){ setTimeout(function(){ renderPanel(true); }, 300); } });
})();

</script>
</body>
</html>
